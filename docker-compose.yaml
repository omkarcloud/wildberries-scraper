services:
  wildberries-scraper:
    build: .
    restart: unless-stopped
    shm_size: "1gb"
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      # Optional: leave this unset to go out from your own connection; if Wildberries
      # refuses your IP, set one datacenter proxy.
      # - WILDBERRIES_PROXY=http://user:pass@host:port
